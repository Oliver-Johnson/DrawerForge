name: build

on:
  push:
    branches: [main]
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      # Fails if index.html is out of date with src/, if either script block has a
      # syntax error, if ui.js references an id the template lacks, or if a
      # display:none element is never un-hidden.
      - run: node build.js --check
      # Geometry audits: footprint/height against the published spec, zmin >= 0,
      # real-mesh cross-sections, and bin-to-socket clearance derived independently.
      - run: node test/bin-audit.js
      - run: node test/fit-check.js
      # A bin descending into the lip of the bin below it, at every height rather than
      # at the step heights. The lip is an inset from the outline and the foot comes
      # from the spec, so the two are maintained apart and have to be checked together.
      - run: node test/stack-check.js
      # Plates are watertight now. Magnets and screws are quarantined by name inside
      # the audit, which fails if a healthy case regresses or a quarantined one starts
      # passing without being taken off the list.
      - run: node test/plate-audit.js
      # A layout travels in the URL hash; it must survive the round trip byte for byte.
      - run: node test/hash-roundtrip.js
      # A saved-drawers file comes from another device or another person, so the
      # importer is tested on the files it must refuse as well as the ones it reads.
      - run: node test/drawers-file.js
      - run: node test/seo-check.js
      # The guides quote real numbers. Nothing connected them to the code they came
      # from, so a change to SPEC would leave three pages quietly lying.
      - run: node test/guide-facts.js
      # The IndexNow key file and the URLs the submitter would send. Every way that
      # wiring breaks is a 403 in a job's log rather than anything visible on the site.
      - run: node test/indexnow-check.js

  # Everything above tests the geometry and the build. This tests the page: place
  # bins, carve, merge, resize, and assert what the interface actually did. Every
  # case here is a bug that shipped, because until now nothing but hand-testing
  # would have caught one.
  ui:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      # the pages are static and load over file://, so there is no server to start
      - run: npx playwright test
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 7

  # Tell the IndexNow engines which pages changed. Bing, Yandex, Seznam, Naver and Yep
  # use the protocol; Google does not, and crawls on its own schedule regardless.
  #
  # After the checks rather than beside them, for two reasons. Nothing should be
  # announced that has not passed, and GitHub Pages publishes asynchronously after the
  # push — by the time the suites above have run, the new page is actually being served,
  # so an engine that comes straight away fetches the new content rather than the old.
  #
  # Only the pages that changed are submitted. The protocol asks that unchanged URLs are
  # not sent, and sending all five on every push would be a standing lie about what is
  # new that costs whatever credibility the signal has.
  indexnow:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: [check, ui]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0        # the diff is against the push's own base, not HEAD^
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Submit the pages this push changed
        env:
          BEFORE: ${{ github.event.before }}
          AFTER: ${{ github.sha }}
        run: |
          # A new branch, a force push or the first push of all reports an all-zero or
          # unreachable base. Submitting everything is the right answer there: it is the
          # one case where every page genuinely is new to the index.
          if [ -z "$BEFORE" ] || ! git cat-file -e "$BEFORE^{commit}" 2>/dev/null; then
            echo "no reachable base commit — submitting every page"
            node tools/indexnow.js --all
          else
            git diff --name-only "$BEFORE" "$AFTER" | tee /dev/stderr | xargs node tools/indexnow.js
          fi
